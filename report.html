<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShieldScan — Security Report</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b12;--bg2:#080f18;--bg3:#0a1520;--bg4:#0d1b28;
  --border:#0e2035;--border2:#122840;--border3:#1a3550;
  --green:#00e5a0;--green2:#00c48a;--green3:#00ff9d;--green-dim:rgba(0,229,160,0.1);
  --red:#ff4d6a;--red-dim:rgba(255,77,106,0.12);
  --yellow:#ffb547;--yellow-dim:rgba(255,181,71,0.12);
  --blue:#4da6ff;--blue-dim:rgba(77,166,255,0.12);
  --purple:#b06aff;--purple-dim:rgba(176,106,255,0.12);
  --text:#c8dff0;--text2:#8fb3cc;--text3:#4a7a99;
  --mono:'JetBrains Mono',monospace;--main:'Inter',sans-serif;
  --glass:rgba(8,15,24,0.8);--glass2:rgba(13,27,40,0.65);
  --sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--main);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,160,0.016) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,0.016) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--green),#00a870);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 14px rgba(0,229,160,0.3);flex-shrink:0}
.logo-text{font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;letter-spacing:1.5px}
.logo-text span{color:var(--green)}
.sidebar-section{padding:14px 12px 6px;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;margin:2px 8px;cursor:pointer;transition:all 0.2s;text-decoration:none;color:var(--text2);font-size:13px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.nav-item.active{background:rgba(0,229,160,0.1);color:var(--green);border:1px solid rgba(0,229,160,0.2)}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.8}
.nav-item.active .nav-icon{opacity:1}
.sidebar-spacer{flex:1}
.upgrade-box{margin:12px;background:linear-gradient(135deg,rgba(0,229,160,0.1),rgba(0,196,138,0.05));border:1px solid rgba(0,229,160,0.25);border-radius:12px;padding:14px;text-align:center}
.upgrade-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px}
.upgrade-sub{font-size:11px;color:var(--text3);margin-bottom:12px;line-height:1.5}
.upgrade-btn{display:block;background:linear-gradient(135deg,var(--green),#00c48a);color:#050b12;padding:8px 16px;border-radius:7px;font-size:12px;font-weight:700;font-family:var(--mono);text-align:center;cursor:pointer;border:none;width:100%;transition:all 0.2s}
.upgrade-btn:hover{box-shadow:0 4px 16px rgba(0,229,160,0.35)}
</style>
<style>
/* ── TOPBAR ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;gap:16px;flex-shrink:0;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.back-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text3);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);transition:all 0.2s;white-space:nowrap;flex-shrink:0}
.back-btn:hover{color:var(--green);border-color:rgba(0,229,160,0.3);background:rgba(0,229,160,0.05)}
.topbar-crumb{font-size:13px;color:var(--text3);font-family:var(--mono)}
.topbar-crumb span{color:var(--text2)}
.topbar-actions{display:flex;align-items:center;gap:10px}
.tb-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;font-size:15px;flex-shrink:0}
.tb-btn:hover{background:rgba(255,255,255,0.08);border-color:var(--border3)}
.tb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green),#00a870);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#050b12;cursor:pointer;font-family:var(--mono);flex-shrink:0}

/* ── CONTENT ── */
.content{padding:28px;flex:1}

/* ── LOADING / ERROR ── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px}
.spinner{width:44px;height:44px;border:3px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--mono);font-size:13px;color:var(--text3);letter-spacing:1px}
.error-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;text-align:center}
.error-icon{font-size:48px;opacity:0.5}
.error-title{font-size:20px;font-weight:700;color:var(--red)}
.error-sub{font-size:14px;color:var(--text3);font-family:var(--mono)}
.error-link{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--green),#00c48a);color:#050b12;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;font-family:var(--mono);text-decoration:none;margin-top:8px;transition:all 0.2s}
.error-link:hover{box-shadow:0 4px 20px rgba(0,229,160,0.35)}

/* ── REPORT HEADER ── */
.report-header{background:var(--glass2);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:16px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.report-header::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.rh-left{}
.report-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1.5px;background:rgba(255,255,255,0.04);border:1px solid var(--border2);padding:4px 12px;border-radius:20px;margin-bottom:10px}
.report-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;letter-spacing:-0.2px}
.report-meta{font-size:13px;color:var(--text3);font-family:var(--mono);display:flex;gap:16px;flex-wrap:wrap}
.report-meta span{display:flex;align-items:center;gap:5px}
.share-box{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;min-width:280px;flex-shrink:0}
.share-inner{flex:1;min-width:0}
.share-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;margin-bottom:4px;text-transform:uppercase}
.share-url{font-family:var(--mono);font-size:12px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-btn{font-family:var(--mono);font-size:10px;font-weight:600;background:transparent;border:1px solid var(--border2);color:var(--text3);padding:6px 12px;border-radius:7px;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0}
.cp-btn:hover{border-color:var(--green);color:var(--green);background:rgba(0,229,160,0.05)}

/* ── OVERVIEW TABS ── */
.tabs-row{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content}
.tab-btn{padding:8px 20px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;background:transparent;color:var(--text3);font-family:var(--main)}
.tab-btn.active{background:rgba(0,229,160,0.12);color:var(--green);border:1px solid rgba(0,229,160,0.25)}
.tab-btn:not(.active):hover{color:var(--text);background:rgba(255,255,255,0.04)}
.tab-panel{display:none;animation:fade-up 0.3s ease}
.tab-panel.active{display:block}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
<style>
/* ── OVERVIEW PANEL ── */
.overview-grid{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-bottom:20px}

/* Score Card */
.score-card{background:var(--glass2);border:1px solid var(--border2);border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.score-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.score-ring-wrap{position:relative;width:130px;height:130px;margin-bottom:16px}
.score-svg{width:130px;height:130px;transform:rotate(-90deg)}
.score-track{fill:none;stroke:var(--border2);stroke-width:8}
.score-fill{fill:none;stroke:var(--green);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(0.4,0,0.2,1);stroke-dasharray:339;stroke-dashoffset:339}
.score-fill.warn{stroke:var(--yellow)}.score-fill.bad{stroke:var(--red)}
.score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc-num{font-size:36px;font-weight:700;font-family:var(--mono);color:#fff;line-height:1}
.sc-denom{font-size:13px;color:var(--text3);font-family:var(--mono)}
.sc-grade{font-size:17px;font-weight:700;font-family:var(--mono);margin-bottom:4px}
.sg-good{color:var(--green)}.sg-warn{color:var(--yellow)}.sg-bad{color:var(--red)}
.sc-desc{font-size:12px;color:var(--text2)}

/* Threat summary cards */
.threat-summary{display:flex;flex-direction:column;gap:12px}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sum-card{background:var(--glass2);border:1px solid var(--border2);border-radius:12px;padding:16px;text-align:center;position:relative;overflow:hidden}
.sum-card.crit-card{border-color:rgba(255,77,106,0.25);background:rgba(255,77,106,0.04)}
.sum-card.warn-card{border-color:rgba(255,181,71,0.25);background:rgba(255,181,71,0.04)}
.sum-card.safe-card{border-color:rgba(0,229,160,0.25);background:rgba(0,229,160,0.04)}
.sum-card.info-card{border-color:rgba(77,166,255,0.25);background:rgba(77,166,255,0.04)}
.sum-num{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;margin-bottom:4px}
.crit-card .sum-num{color:var(--red)}.warn-card .sum-num{color:var(--yellow)}
.safe-card .sum-num{color:var(--green)}.info-card .sum-num{color:var(--blue)}
.sum-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:0.8px;text-transform:uppercase}

/* Threat alerts strip */
.threat-alerts{display:flex;flex-direction:column;gap:8px}
.t-alert{display:flex;align-items:center;gap:12px;background:var(--glass2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px}
.t-alert.high{border-left:3px solid var(--red);background:rgba(255,77,106,0.04)}
.t-alert.med{border-left:3px solid var(--yellow);background:rgba(255,181,71,0.04)}
.t-alert.low{border-left:3px solid var(--blue);background:rgba(77,166,255,0.04)}
.t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-red{background:var(--red);box-shadow:0 0 6px rgba(255,77,106,0.6)}
.dot-yellow{background:var(--yellow);box-shadow:0 0 6px rgba(255,181,71,0.6)}
.dot-blue{background:var(--blue);box-shadow:0 0 6px rgba(77,166,255,0.6)}
.t-text{flex:1;font-size:13px;color:var(--text2)}
.t-count{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px}
.tc-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.25)}
.tc-yellow{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,181,71,0.25)}
.tc-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(77,166,255,0.25)}

/* ── SYSTEM INFO ── */
.sysinfo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.si-card{background:var(--glass2);border:1px solid var(--border2);border-radius:12px;padding:14px}
.si-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.si-val{font-family:var(--mono);font-size:13px;color:var(--text);word-break:break-all;line-height:1.4}
.si-val.green{color:var(--green)}.si-val.red{color:var(--red)}
</style>
<style>
/* ── FINDINGS LIST ── */
.findings-section{margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sec-label{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:2px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sec-count{font-family:var(--mono);font-size:11px;color:var(--text3);background:rgba(255,255,255,0.04);padding:3px 9px;border-radius:5px}
.findings-list{display:flex;flex-direction:column;gap:8px}
.empty-msg{font-family:var(--mono);font-size:12px;color:var(--green);padding:14px 16px;background:rgba(0,229,160,0.04);border:1px solid rgba(0,229,160,0.15);border-radius:8px;display:flex;align-items:center;gap:8px}
.finding-item{display:flex;align-items:flex-start;gap:14px;background:var(--glass2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;transition:border-color 0.2s}
.finding-item:hover{border-color:var(--border3)}
.finding-item.crit{border-left:3px solid var(--red)}
.finding-item.warn{border-left:3px solid var(--yellow)}
.finding-item.safe{border-left:3px solid var(--green)}
.finding-item.info-fi{border-left:3px solid var(--blue)}
.fi-icon-wrap{font-size:16px;flex-shrink:0;margin-top:2px;width:20px;text-align:center}
.fi-body{flex:1;min-width:0}
.fi-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}
.fi-detail{font-size:12px;color:var(--text2);font-family:var(--mono);line-height:1.55;word-break:break-word}
.fi-rec{font-size:12px;color:var(--green);font-family:var(--mono);margin-top:5px;display:flex;align-items:flex-start;gap:5px}
.fi-badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 10px;border-radius:6px;flex-shrink:0;align-self:flex-start;letter-spacing:0.5px}
.badge-crit{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.3)}
.badge-warn{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,181,71,0.3)}
.badge-safe{background:rgba(0,229,160,0.1);color:var(--green);border:1px solid rgba(0,229,160,0.3)}
.badge-info-b{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(77,166,255,0.3)}

/* ── TABLES (ports / connections) ── */
.table-wrap{background:var(--glass2);border:1px solid var(--border2);border-radius:14px;overflow:hidden;margin-bottom:20px}
.table-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.table-title{font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:2px;font-weight:600}
.table-badge{font-family:var(--mono);font-size:10px;color:var(--text3);background:rgba(255,255,255,0.04);padding:3px 9px;border-radius:5px}
table{width:100%;border-collapse:collapse}
thead th{padding:11px 18px;font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1.5px;text-align:left;text-transform:uppercase;border-bottom:1px solid var(--border);font-weight:600}
tbody td{padding:11px 18px;font-family:var(--mono);font-size:12px;color:var(--text);border-bottom:1px solid rgba(14,32,53,0.7);word-break:break-all}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,0.02)}
.td-danger{color:var(--red)}.td-ok{color:var(--green)}.td-warn{color:var(--yellow)}
.td-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:6px}
.tdb-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.25)}
.tdb-green{background:rgba(0,229,160,0.08);color:var(--green);border:1px solid rgba(0,229,160,0.25)}
.tdb-yellow{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,181,71,0.25)}

/* ── FOOTER ACTIONS ── */
.report-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;border-top:1px solid var(--border);margin-top:8px;flex-wrap:wrap}
.footer-new-scan{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--green),#00c48a);color:#050b12;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:700;font-family:var(--mono);text-decoration:none;transition:all 0.2s;box-shadow:0 4px 16px rgba(0,229,160,0.25)}
.footer-new-scan:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,229,160,0.4)}
.footer-remove{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border2);color:var(--text2);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;font-family:var(--mono);cursor:pointer;transition:all 0.2s}
.footer-remove:hover{border-color:var(--red);color:var(--red);background:rgba(255,77,106,0.05)}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .overview-grid{grid-template-columns:1fr}
  .summary-row{grid-template-columns:repeat(2,1fr)}
  .sysinfo-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .sidebar{display:none}
  .content{padding:16px}
  .report-header{flex-direction:column}
  .share-box{min-width:unset;width:100%}
  .overview-grid{grid-template-columns:1fr}
  .sysinfo-grid{grid-template-columns:1fr 1fr}
  .summary-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .sysinfo-grid{grid-template-columns:1fr}
  .summary-row{grid-template-columns:repeat(2,1fr)}
  .tabs-row{width:100%;flex-wrap:wrap}
  .tab-btn{flex:1;text-align:center}
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <div class="logo-icon">🛡</div>
      <div class="logo-text">SHIELD<span>SCAN</span></div>
    </a>
    <div class="sidebar-section">Main</div>
    <a href="/dashboard.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/cs.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Scanner
    </a>
    <div class="sidebar-section">Tools</div>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><circle cx="12" cy="20" r="1"/></svg>
      Network Tools
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Web Security
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      System Tools
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Privacy Tools
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      Password Tools
    </a>
    <div class="sidebar-section">Extras</div>
    <a href="#" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Reports
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M2 12h2M20 12h2M19.07 19.07l-1.41-1.41M5.34 5.34L3.93 3.93"/></svg>
      Settings
    </a>
    <div class="sidebar-spacer"></div>
    <div class="upgrade-box">
      <div class="upgrade-title">Upgrade to Pro</div>
      <div class="upgrade-sub">Unlock all features and unlimited scans</div>
      <button class="upgrade-btn">Upgrade Now →</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/" class="back-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Scanner
        </a>
        <div class="topbar-crumb">Scanner / <span>Scan Results</span></div>
      </div>
      <div class="topbar-actions">
        <div class="tb-btn" title="Notifications">🔔</div>
        <div class="tb-btn" title="Export">📤</div>
        <div class="tb-avatar">S</div>
      </div>
    </header>

    <div class="content">
      <div id="content">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <div class="loading-text">LOADING REPORT...</div>
        </div>
      </div>
    </div>
  </div>

</div><!-- end .app -->

<script>
const sid = window.location.pathname.split('/').pop().toUpperCase();

// Update topbar crumb with report ID
document.querySelector('.topbar-crumb').innerHTML = `Scanner / <span>Report #${sid}</span>`;

fetch('/api/report/' + sid)
  .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('content').innerHTML = `
      <div class="error-wrap">
        <div class="error-icon">🔍</div>
        <div class="error-title">Report Not Found</div>
        <div class="error-sub">Report #${sid} does not exist or has expired.</div>
        <a href="/" class="error-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Run a New Scan
        </a>
      </div>`;
  });

function render(d) {
  const s = d.score || 0;
  const findings = d.findings || [];
  const crits = findings.filter(f => f.severity === 'Critical');
  const warns = findings.filter(f => f.severity === 'Warning');
  const safes = findings.filter(f => f.severity === 'Safe');
  const infos = findings.filter(f => f.severity === 'Info');
  const sys = d.system_info || {};
  const url = window.location.href;

  let grade, gc, fillCls, desc;
  if (s >= 80)      { grade = 'Very Good';   gc = 'sg-good'; fillCls = '';     desc = 'Your system is well protected'; }
  else if (s >= 55) { grade = 'At Risk';     gc = 'sg-warn'; fillCls = 'warn'; desc = 'Some issues need attention'; }
  else              { grade = 'Vulnerable';  gc = 'sg-bad';  fillCls = 'bad';  desc = 'Immediate action recommended'; }

  const scanTypeLabel = d.scan_type === 'agent' ? 'Deep Agent Scan' : 'Browser Scan';
  const createdAt = d.created_at ? new Date(d.created_at).toLocaleString() : '—';

  document.getElementById('content').innerHTML = `
    <!-- REPORT HEADER -->
    <div class="report-header">
      <div class="rh-left">
        <div class="report-tag">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          SCAN REPORT
        </div>
        <div class="report-title">Security Analysis Report</div>
        <div class="report-meta">
          <span>📋 #${d.id}</span>
          <span>🔍 ${scanTypeLabel}</span>
          <span>🕐 ${createdAt}</span>
          ${d.os ? `<span>💻 ${d.os}</span>` : ''}
        </div>
      </div>
      <div class="share-box">
        <div class="share-inner">
          <div class="share-label">Share This Report</div>
          <div class="share-url">${url}</div>
        </div>
        <button class="cp-btn" id="cpBtn" onclick="copyUrl('${url}')">Copy Link</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-row">
      <button class="tab-btn active" onclick="switchTab('overview',this)">📊 Overview</button>
      <button class="tab-btn" onclick="switchTab('threats',this)">⚠ Threats (${crits.length + warns.length})</button>
      <button class="tab-btn" onclick="switchTab('details',this)">📋 Details</button>
      <button class="tab-btn" onclick="switchTab('recommendations',this)">💡 Recommendations</button>
    </div>

    <!-- OVERVIEW TAB -->
    <div class="tab-panel active" id="tab-overview">
      <div class="overview-grid">
        <div class="score-card">
          <div class="score-ring-wrap">
            <svg class="score-svg" viewBox="0 0 120 120">
              <circle class="score-track" cx="60" cy="60" r="54"/>
              <circle class="score-fill ${fillCls}" id="scoreFill" cx="60" cy="60" r="54"/>
            </svg>
            <div class="score-inner">
              <div class="sc-num">${s}</div>
              <div class="sc-denom">/100</div>
            </div>
          </div>
          <div class="sc-grade ${gc}">${grade}</div>
          <div class="sc-desc">${desc}</div>
        </div>
        <div class="threat-summary">
          <div class="summary-row">
            <div class="sum-card crit-card"><div class="sum-num">${crits.length}</div><div class="sum-lbl">Critical</div></div>
            <div class="sum-card warn-card"><div class="sum-num">${warns.length}</div><div class="sum-lbl">Warnings</div></div>
            <div class="sum-card safe-card"><div class="sum-num">${safes.length}</div><div class="sum-lbl">Passed</div></div>
            <div class="sum-card info-card"><div class="sum-num">${findings.length}</div><div class="sum-lbl">Total</div></div>
          </div>
          <div class="threat-alerts">
            <div class="t-alert high">
              <div class="t-dot dot-red"></div>
              <div class="t-text">${crits.length} High Risk Threats — ${crits.length > 0 ? 'Should be resolved immediately' : 'None found'}</div>
              <div class="t-count tc-red">${crits.length > 0 ? 'Risk: High' : 'Clear'}</div>
            </div>
            <div class="t-alert med">
              <div class="t-dot dot-yellow"></div>
              <div class="t-text">${warns.length} Medium Risk Threats — ${warns.length > 0 ? 'Should be reviewed' : 'None found'}</div>
              <div class="t-count tc-yellow">${warns.length > 0 ? 'Risk: Med' : 'Clear'}</div>
            </div>
            <div class="t-alert low">
              <div class="t-dot dot-blue"></div>
              <div class="t-text">${safes.length + infos.length} Low Risk / Info — System of your device is ${s >= 80 ? 'secure' : 'at risk'}</div>
              <div class="t-count tc-blue">${s >= 80 ? 'Risk: Low' : 'Risk: Med'}</div>
            </div>
          </div>
        </div>
      </div>
      ${buildSysInfo(sys)}
    </div>

    <!-- THREATS TAB -->
    <div class="tab-panel" id="tab-threats">
      ${buildFindingsSection('Critical Findings', crits, 'crit', 'var(--red)')}
      ${buildFindingsSection('Warnings', warns, 'warn', 'var(--yellow)')}
      ${buildFindingsSection('Passed Checks', safes, 'safe', 'var(--green)')}
      ${buildFindingsSection('Information', infos, 'info-fi', 'var(--blue)')}
    </div>

    <!-- DETAILS TAB -->
    <div class="tab-panel" id="tab-details">
      ${buildSysInfo(sys)}
      ${buildPortsTable(d.open_ports || [])}
      ${buildConnectionsTable(d.connections || [])}
    </div>

    <!-- RECOMMENDATIONS TAB -->
    <div class="tab-panel" id="tab-recommendations">
      ${buildRecommendations(findings)}
    </div>

    <!-- FOOTER -->
    <div class="report-footer">
      <a href="/" class="footer-new-scan">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        Run New Scan
      </a>
      <button class="footer-remove" onclick="alert('Export feature available in Pro plan.')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Report
      </button>
    </div>`;

  // Animate score ring
  const circumference = 339;
  const offset = circumference - (s / 100) * circumference;
  setTimeout(() => {
    const fill = document.getElementById('scoreFill');
    if (fill) fill.style.strokeDashoffset = offset;
  }, 150);
}
</script>
<script>
function buildSysInfo(sys) {
  if (!sys || !sys.os) return '';
  return `
    <div class="sysinfo-grid">
      <div class="si-card"><div class="si-label">OS</div><div class="si-val">${sys.os || '—'}</div></div>
      <div class="si-card"><div class="si-label">Hostname</div><div class="si-val">${sys.hostname || '—'}</div></div>
      <div class="si-card"><div class="si-label">Local IP</div><div class="si-val">${sys.local_ip || '—'}</div></div>
      <div class="si-card"><div class="si-label">CPU Cores</div><div class="si-val">${sys.cpu_count || '—'}</div></div>
      <div class="si-card"><div class="si-label">RAM</div><div class="si-val">${sys.ram_gb ? sys.ram_gb + ' GB' : '—'}</div></div>
      <div class="si-card"><div class="si-label">Scan Time</div><div class="si-val">${sys.scan_time || '—'}</div></div>
    </div>`;
}

function buildFindingsSection(title, items, cls, color) {
  const icons = { crit: '⚠', warn: '◈', safe: '✓', 'info-fi': 'ℹ' };
  const badges = { crit: 'badge-crit', warn: 'badge-warn', safe: 'badge-safe', 'info-fi': 'badge-info-b' };
  const labels = { crit: 'CRITICAL', warn: 'WARNING', safe: 'SAFE', 'info-fi': 'INFO' };

  let itemsHtml = '';
  if (items.length === 0) {
    itemsHtml = `<div class="empty-msg">✓ No ${title.toLowerCase()} found.</div>`;
  } else {
    items.forEach(f => {
      itemsHtml += `
        <div class="finding-item ${cls}">
          <div class="fi-icon-wrap">${icons[cls] || 'ℹ'}</div>
          <div class="fi-body">
            <div class="fi-name">${f.name}</div>
            <div class="fi-detail">${f.detail}</div>
            ${f.recommendation ? `<div class="fi-rec"><span style="color:var(--text3)">→</span> ${f.recommendation}</div>` : ''}
          </div>
          <div class="fi-badge ${badges[cls]}">${labels[cls]}</div>
        </div>`;
    });
  }
  return `
    <div class="findings-section">
      <div class="section-header">
        <div class="sec-label">
          <span class="sec-dot" style="background:${color}"></span>
          ${title}
        </div>
        <div class="sec-count">${items.length} found</div>
      </div>
      <div class="findings-list">${itemsHtml}</div>
    </div>`;
}

function buildPortsTable(ports) {
  if (!ports || !ports.length) return '';
  let rows = ports.map(p => `
    <tr>
      <td class="${p.dangerous ? 'td-danger' : 'td-ok'}">${p.port}</td>
      <td>${p.process || '—'}</td>
      <td>
        <span class="td-badge ${p.dangerous ? 'tdb-red' : 'tdb-green'}">
          ${p.dangerous ? '⚠ Dangerous' : '✓ Safe'}
        </span>
      </td>
    </tr>`).join('');
  return `
    <div class="table-wrap">
      <div class="table-head">
        <div class="table-title">// OPEN PORTS</div>
        <div class="table-badge">${ports.length} ports found</div>
      </div>
      <table>
        <thead><tr><th>Port</th><th>Process</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function buildConnectionsTable(conns) {
  if (!conns || !conns.length) return '';
  let rows = conns.map(c => `
    <tr>
      <td>${c.remote || '—'}</td>
      <td>${c.process || '—'}</td>
      <td>
        <span class="td-badge ${c.suspicious ? 'tdb-red' : 'tdb-green'}">
          ${c.suspicious ? '⚠ Suspicious' : '✓ OK'}
        </span>
      </td>
    </tr>`).join('');
  return `
    <div class="table-wrap">
      <div class="table-head">
        <div class="table-title">// ACTIVE CONNECTIONS</div>
        <div class="table-badge">${conns.length} connections</div>
      </div>
      <table>
        <thead><tr><th>Remote Address</th><th>Process</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function buildRecommendations(findings) {
  const recs = findings.filter(f => f.recommendation);
  const general = [
    { icon: '🔒', title: 'Use a VPN', desc: 'A VPN encrypts your traffic and hides your real IP from websites and ISPs.' },
    { icon: '🌐', title: 'Enable HTTPS Everywhere', desc: 'Use browser extensions that force HTTPS connections on all websites.' },
    { icon: '🔍', title: 'Disable WebRTC', desc: 'Use browser settings or extensions to disable WebRTC to prevent IP leaks.' },
    { icon: '🛡️', title: 'Update Your Browser', desc: 'Keep your browser updated to get the latest security patches and protections.' },
  ];
  let html = '<div class="findings-section"><div class="section-header"><div class="sec-label"><span class="sec-dot" style="background:var(--blue)"></span>Security Recommendations</div></div><div class="findings-list">';
  if (recs.length) {
    recs.forEach(f => {
      html += `<div class="finding-item info-fi"><div class="fi-icon-wrap">💡</div><div class="fi-body"><div class="fi-name">${f.name}</div><div class="fi-rec">→ ${f.recommendation}</div></div><div class="fi-badge badge-info-b">FIX</div></div>`;
    });
  }
  general.forEach(r => {
    html += `<div class="finding-item info-fi"><div class="fi-icon-wrap">${r.icon}</div><div class="fi-body"><div class="fi-name">${r.title}</div><div class="fi-detail">${r.desc}</div></div><div class="fi-badge badge-info-b">TIP</div></div>`;
  });
  html += '</div></div>';
  return html;
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const panel = document.getElementById('tab-' + name);
  if (panel) panel.classList.add('active');
  if (btn) btn.classList.add('active');
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('cpBtn');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = 'Copy Link'; }, 2000); }
  }).catch(() => {});
}
</script>
</body>
</html>
